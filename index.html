<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瞳舞舞 · Alice-tower</title>
    <style>
        :root {
          --mx: 50%;
          --my: 50%;
          --rx: 0deg;
          --ry: 0deg;
          --cyan: #b8fbff;
          --violet: #aa88ff;
          --pink: #ff9bdd;
          --moon: #fff7dc;
        }

        * { box-sizing: border-box; }

        html, body {
          width: 100%;
          height: 100%;
          margin: 0;
          overflow: hidden;
          background: #03020b;
          color: white;
          font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
          user-select: none;
          -webkit-user-select: none;
          caret-color: transparent;
          -webkit-tap-highlight-color: transparent;
        }

        ::selection { background: transparent; }

        body {
          position: relative;
          isolation: isolate;
          background:
            radial-gradient(circle at var(--mx) var(--my), rgba(171, 127, 255, .15), transparent 28%),
            radial-gradient(ellipse at 50% 115%, #221044 0, #090719 40%, transparent 68%),
            linear-gradient(150deg, #03020b 0%, #09061a 52%, #05151c 100%);
        }

        body::before {
          content: "";
          position: fixed;
          inset: 0;
          z-index: -2;
          opacity: .44;
          background:
            radial-gradient(ellipse at 20% 62%, rgba(119, 239, 255, .12), transparent 28%),
            radial-gradient(ellipse at 80% 35%, rgba(255, 139, 219, .1), transparent 26%),
            linear-gradient(115deg, transparent 28%, rgba(126, 236, 255, .08) 43%, transparent 58%);
          filter: blur(36px);
          animation: aurora 12s ease-in-out infinite alternate;
        }

        body::after {
          content: "";
          position: fixed;
          inset: -50%;
          z-index: -3;
          background: conic-gradient(from 0deg, transparent, #7554b5 12%, transparent 24%, #23566a 38%, transparent 54%, #7b385f 72%, transparent);
          filter: blur(130px);
          opacity: .2;
          animation: universe 30s linear infinite;
        }

        #space, #sparks {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
        }

        #space { z-index: -1; }
        #sparks { z-index: 2; }

        .butterfly-field {
          position: fixed;
          inset: 0;
          z-index: 6;
          overflow: hidden;
          pointer-events: none;
        }

        .butterfly {
          position: absolute;
          width: var(--size);
          height: calc(var(--size) * .72);
          opacity: 0;
          filter:
            drop-shadow(0 0 5px rgba(207, 244, 255, .5))
            drop-shadow(0 0 11px rgba(173, 139, 238, .25));
          transform-origin: center;
          will-change: transform, opacity;
        }

        .butterfly::before {
          content: "";
          position: absolute;
          z-index: 2;
          left: 50%;
          top: 20%;
          width: 2px;
          height: 58%;
          translate: -50%;
          border-radius: 50%;
          background: linear-gradient(to bottom, rgba(255,255,255,.92), rgba(169,145,215,.5));
          box-shadow: 0 0 5px rgba(237, 248, 255, .65);
        }

        .butterfly .wing {
          position: absolute;
          top: 4%;
          width: 52%;
          height: 78%;
          border: 1px solid rgba(225, 243, 255, .52);
          background:
            radial-gradient(circle at 68% 58%, rgba(255,255,255,.22), transparent 22%),
            linear-gradient(145deg, rgba(222, 250, 255, .46), rgba(180, 151, 230, .24) 58%, rgba(255, 173, 220, .12));
          box-shadow:
            inset 0 0 9px rgba(255,255,255,.12),
            0 0 8px rgba(190, 225, 255, .24);
          backdrop-filter: blur(1px);
          will-change: transform;
        }

        .butterfly .wing.left {
          right: 50%;
          border-radius: 82% 24% 68% 34%;
          transform-origin: right center;
          animation: flap-left var(--flap) ease-in-out infinite alternate;
        }

        .butterfly .wing.right {
          left: 50%;
          border-radius: 24% 82% 34% 68%;
          transform-origin: left center;
          animation: flap-right var(--flap) ease-in-out infinite alternate;
        }

        .noise {
          position: fixed;
          inset: 0;
          z-index: 20;
          pointer-events: none;
          opacity: .035;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
          animation: noise .4s steps(2) infinite;
        }

        .scene {
          height: 100%;
          display: grid;
          place-items: center;
          perspective: 1000px;
        }

        .core {
          position: relative;
          display: grid;
          place-items: center;
          width: min(88vw, 880px);
          aspect-ratio: 1.7;
          transform-style: preserve-3d;
          transform: rotateX(var(--rx)) rotateY(var(--ry));
          transition: transform .15s ease-out;
        }

        .halo {
          position: absolute;
          width: 54%;
          aspect-ratio: 1;
          border-radius: 50%;
          background: conic-gradient(from 180deg, transparent 0 16%, rgba(184,251,255,.86) 21%, transparent 29% 46%, rgba(255,155,221,.8) 54%, transparent 64% 78%, rgba(170,136,255,.82) 87%, transparent);
          filter: blur(7px) drop-shadow(0 0 35px rgba(153, 110, 255, .58));
          opacity: .62;
          animation: spin 22s linear infinite;
        }

        .halo::after {
          content: "";
          position: absolute;
          inset: 7%;
          border-radius: inherit;
          background: radial-gradient(circle, rgba(8,6,24,.8), #03020b 72%);
          box-shadow: inset 0 0 70px 12px rgba(126, 84, 227, .2);
        }

        .orbit, .orbit::before, .orbit::after {
          position: absolute;
          border: 1px solid rgba(205, 228, 255, .17);
          border-radius: 50%;
        }

        .orbit {
          width: 88%;
          height: 58%;
          transform: rotate(-8deg);
          animation: orbit 13s ease-in-out infinite alternate;
        }

        .orbit::before, .orbit::after {
          content: "";
          width: 7px;
          height: 7px;
          border: 0;
          background: #fff;
          top: 48%;
          box-shadow: 0 0 8px #fff, 0 0 22px var(--cyan), 0 0 38px var(--cyan);
        }

        .orbit::before { left: -4px; }
        .orbit::after { right: -4px; background: var(--pink); box-shadow: 0 0 8px #fff, 0 0 22px var(--pink), 0 0 38px var(--pink); }

        .time-rings {
          position: absolute;
          inset: 5% 2%;
          z-index: 0;
          transform-style: preserve-3d;
          pointer-events: none;
        }

        .time-rings i {
          position: absolute;
          inset: 12%;
          border: 1px solid rgba(214, 199, 255, .12);
          border-radius: 50%;
          box-shadow: 0 0 20px rgba(170, 136, 255, .06);
          animation: time-echo 8s ease-out infinite;
        }

        .time-rings i:nth-child(2) { animation-delay: -2.66s; }
        .time-rings i:nth-child(3) { animation-delay: -5.32s; }

        .title-wrap {
          position: relative;
          z-index: 3;
          transform: translateZ(90px);
          text-align: center;
        }

        .title {
          position: relative;
          margin: 0;
          font-size: clamp(4.8rem, 14vw, 10rem);
          font-weight: 900;
          line-height: 1.08;
          letter-spacing: .06em;
          color: transparent;
          -webkit-text-stroke: .7px rgba(235, 233, 255, .5);
          background:
            linear-gradient(105deg, #d9e8ee 4%, #a8d9df 23%, #a696ce 43%, #d8d4e5 54%, #d39abb 72%, #91c3ca 94%);
          background-size: 180% auto;
          background-clip: text;
          -webkit-background-clip: text;
          filter:
            drop-shadow(0 0 1px rgba(255,255,255,.7))
            drop-shadow(0 0 8px rgba(170, 226, 235, .42))
            drop-shadow(0 0 22px rgba(145, 112, 210, .3));
          animation: shimmer 10s ease-in-out infinite alternate, breathe 6s ease-in-out infinite;
          cursor: default;
          user-select: none;
        }

        .title::before, .title::after {
          content: "瞳舞舞";
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        .title::before {
          color: var(--cyan);
          opacity: .07;
          transform: translate(-3px, 2px);
          filter: blur(1.5px);
          animation: dream-a 7s ease-in-out infinite;
        }

        .title::after {
          color: var(--pink);
          opacity: .06;
          transform: translate(3px, -2px);
          filter: blur(1.5px);
          animation: dream-b 7s ease-in-out infinite;
        }

        .eyebrow {
          margin-bottom: 20px;
          font: 500 .72rem/1 Georgia, "Times New Roman", serif;
          font-style: italic;
          letter-spacing: .58em;
          color: rgba(231, 224, 255, .76);
          text-shadow: 0 0 16px var(--violet);
          animation: fade-pulse 4.5s ease-in-out infinite;
        }

        .poem {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: clamp(8px, 2vw, 22px);
          margin-top: 24px;
          font-family: "Songti SC", "STSong", serif;
          font-size: clamp(.66rem, 1.35vw, .8rem);
          letter-spacing: .18em;
          color: rgba(245, 239, 255, .58);
          white-space: nowrap;
          text-shadow: 0 0 15px rgba(184, 151, 255, .32);
        }

        .poem span {
          opacity: 0;
          animation: verse 8s ease-in-out infinite;
        }

        .poem span:nth-child(2) { animation-delay: .55s; }
        .poem span:nth-child(3) { animation-delay: 1.1s; }
        .poem span:nth-child(4) { animation-delay: 1.65s; }

        .poem b {
          width: 3px;
          height: 3px;
          border-radius: 50%;
          background: var(--moon);
          opacity: .45;
          box-shadow: 0 0 9px var(--moon);
        }

        .line {
          width: min(360px, 60vw);
          height: 1px;
          margin: 17px auto 0;
          background: linear-gradient(90deg, transparent, rgba(184,251,255,.8), #fff9e8, rgba(255,155,221,.7), transparent);
          box-shadow: 0 0 16px rgba(184, 238, 255, .48);
          transform: scaleX(.55);
          animation: line 2.4s ease-in-out infinite;
        }

        .corner {
          position: fixed;
          width: 36px;
          height: 36px;
          opacity: .35;
          border-color: #c4efff;
        }
        .tl { top: 24px; left: 24px; border-top: 1px solid; border-left: 1px solid; }
        .tr { top: 24px; right: 24px; border-top: 1px solid; border-right: 1px solid; }
        .bl { bottom: 24px; left: 24px; border-bottom: 1px solid; border-left: 1px solid; }
        .br { bottom: 24px; right: 24px; border-bottom: 1px solid; border-right: 1px solid; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes universe { to { transform: rotate(360deg) scale(1.08); } }
        @keyframes shimmer {
          from { background-position: 5% center; }
          to { background-position: 95% center; }
        }
        @keyframes aurora { to { transform: translate3d(4%, -3%, 0) scale(1.08); opacity: .65; } }
        @keyframes breathe {
          0%, 100% {
            filter:
              drop-shadow(0 0 1px rgba(255,255,255,.65))
              drop-shadow(0 0 8px rgba(170, 226, 235, .38))
              drop-shadow(0 0 20px rgba(145, 112, 210, .27));
          }
          50% {
            filter:
              drop-shadow(0 0 2px rgba(255,255,255,.72))
              drop-shadow(0 0 11px rgba(170, 226, 235, .46))
              drop-shadow(0 0 27px rgba(145, 112, 210, .33));
          }
        }
        @keyframes orbit { to { transform: rotate(8deg) scale(1.04); } }
        @keyframes line { 50% { transform: scaleX(1); opacity: .55; } }
        @keyframes fade-pulse { 50% { opacity: .42; letter-spacing: .66em; } }
        @keyframes noise { 0% { transform: translate(0); } 25% { transform: translate(1%, -1%); } 50% { transform: translate(-1%, 1%); } 75% { transform: translate(1%, 1%); } }
        @keyframes dream-a { 50% { transform: translate(-6px, 3px); opacity: .025; } }
        @keyframes dream-b { 50% { transform: translate(6px, -3px); opacity: .025; } }
        @keyframes time-echo { 0% { transform: scale(.45) rotate(-8deg); opacity: 0; } 20% { opacity: .32; } 100% { transform: scale(1.28) rotate(8deg); opacity: 0; } }
        @keyframes verse { 0%, 10%, 84%, 100% { opacity: .2; transform: translateY(2px); } 24%, 68% { opacity: .76; transform: translateY(0); } }
        @keyframes flap-left {
          from { transform: perspective(28px) rotateY(-14deg) rotate(-8deg); }
          to { transform: perspective(28px) rotateY(67deg) rotate(4deg); }
        }
        @keyframes flap-right {
          from { transform: perspective(28px) rotateY(14deg) rotate(8deg); }
          to { transform: perspective(28px) rotateY(-67deg) rotate(-4deg); }
        }

        @media (max-width: 600px) {
          .core { width: 94vw; }
          .halo { width: 72%; }
          .orbit { width: 100%; height: 58%; }
          .title { letter-spacing: .02em; }
          .eyebrow { letter-spacing: .45em; }
          .poem { gap: 5px; font-size: .58rem; letter-spacing: .04em; }
          .poem b { opacity: .3; }
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="butterfly-field" id="butterflyField" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

<main class="scene">
    <section class="core" id="core" aria-label="瞳舞舞">
        <div class="time-rings" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="halo"></div>
        <div class="orbit"></div>
        <div class="title-wrap">
            <div class="eyebrow">Alice-tower</div>
            <h1 class="title">瞳舞舞</h1>
            <div class="line"></div>
            <div class="poem" aria-label="幻的妖精，舞于时空，一梦留痕，余香宛然">
                <span>幻的妖精</span><b></b>
                <span>舞于时空</span><b></b>
                <span>一梦留痕</span><b></b>
                <span>余香宛然</span>
            </div>
        </div>
    </section>
</main>
<script>
    const root = document.documentElement;
    const core = document.querySelector('#core');
    const space = document.querySelector('#space');
    const sparksCanvas = document.querySelector('#sparks');
    const butterflyField = document.querySelector('#butterflyField');
    const ctx = space.getContext('2d');
    const sctx = sparksCanvas.getContext('2d');
    let w, h, dpr, stars = [], sparks = [], lastTrail = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      for (const canvas of [space, sparksCanvas]) {
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.min(180, Math.floor(w * h / 6500)) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + .2,
        a: Math.random(),
        speed: Math.random() * .006 + .002,
        phase: Math.random() * Math.PI * 2,
        drift: Math.random() * .045 + .008
      }));
    }

    function animate(t) {
      ctx.clearRect(0, 0, w, h);
      for (const star of stars) {
        const alpha = .16 + Math.sin(t * star.speed + star.phase) * .14 + star.a * .5;
        star.y -= star.drift;
        star.x += Math.sin(t * .0002 + star.phase) * .012;
        if (star.y < -4) { star.y = h + 4; star.x = Math.random() * w; }
        ctx.beginPath();
        ctx.fillStyle = `rgba(220,235,255,${Math.max(0, alpha)})`;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      sctx.clearRect(0, 0, w, h);

      sparks = sparks.filter(p => p.life > 0);
      for (const p of sparks) {
        const oldX = p.x, oldY = p.y;
        p.x += p.vx; p.y += p.vy;
        p.vx *= .988; p.vy = p.vy * .988 - .006;
        p.life -= p.decay;
        sctx.globalAlpha = Math.max(0, p.life);
        sctx.shadowBlur = 14;
        sctx.shadowColor = p.color;
        sctx.strokeStyle = p.color;
        sctx.lineWidth = p.size;
        sctx.beginPath();
        sctx.moveTo(oldX, oldY);
        sctx.lineTo(p.x, p.y);
        sctx.stroke();
      }
      sctx.globalAlpha = 1;
      sctx.shadowBlur = 0;
      requestAnimationFrame(animate);
    }

    function releaseButterflies(x, y) {
      if (butterflyField.childElementCount > 14) return;

      for (let i = 0; i < 4; i++) {
        const butterfly = document.createElement('i');
        const size = Math.random() * 12 + 17;
        const direction = i % 2 === 0 ? -1 : 1;
        const duration = Math.random() * 700 + 3500;
        const drift = direction * (Math.random() * 85 + 45);
        const rise = Math.random() * 110 + 125;

        butterfly.className = 'butterfly';
        butterfly.style.left = `${x - size / 2}px`;
        butterfly.style.top = `${y - size / 2}px`;
        butterfly.style.setProperty('--size', `${size}px`);
        butterfly.style.setProperty('--flap', `${Math.random() * .18 + .34}s`);
        butterfly.innerHTML = '<span class="wing left"></span><span class="wing right"></span>';
        butterflyField.appendChild(butterfly);

        const flight = butterfly.animate([
          {
            transform: `translate(0, 0) rotate(${direction * -8}deg) scale(.72)`,
            opacity: 0,
            easing: 'cubic-bezier(.45,0,.55,1)'
          },
          {
            transform: `translate(${drift * .34}px, ${-rise * .2}px) rotate(${direction * 13}deg) scale(1)`,
            opacity: .78,
            offset: .28
          },
          {
            transform: `translate(${drift * -.12}px, ${-rise * .46}px) rotate(${direction * -11}deg) scale(.96)`,
            opacity: .68,
            offset: .58
          },
          {
            transform: `translate(${drift * .64}px, ${-rise * .72}px) rotate(${direction * 17}deg) scale(.88)`,
            opacity: .52,
            offset: .82
          },
          {
            transform: `translate(${drift}px, ${-rise}px) rotate(${direction * 25}deg) scale(.62)`,
            opacity: 0
          }
        ], {
          duration,
          delay: i * 55,
          easing: 'cubic-bezier(.22,.65,.3,1)',
          fill: 'forwards'
        });

        flight.onfinish = () => butterfly.remove();
      }
    }

    addEventListener('pointermove', e => {
      const nx = e.clientX / w - .5;
      const ny = e.clientY / h - .5;
      root.style.setProperty('--mx', `${e.clientX}px`);
      root.style.setProperty('--my', `${e.clientY}px`);
      root.style.setProperty('--ry', `${nx * 7}deg`);
      root.style.setProperty('--rx', `${ny * -6}deg`);
      if (performance.now() - lastTrail > 38 && sparks.length < 150) {
        lastTrail = performance.now();
        sparks.push({
          x: e.clientX + (Math.random() - .5) * 8,
          y: e.clientY + (Math.random() - .5) * 8,
          vx: (Math.random() - .5) * .35,
          vy: -Math.random() * .35 - .08,
          life: .62,
          decay: .018,
          size: Math.random() * 1.4 + .3,
          color: Math.random() > .5 ? '#b8fbff' : '#d7bcff'
        });
      }
    });

    addEventListener('pointerleave', () => {
      root.style.setProperty('--ry', '0deg');
      root.style.setProperty('--rx', '0deg');
    });

    addEventListener('click', e => {
      releaseButterflies(e.clientX, e.clientY);
    });

    addEventListener('selectstart', e => e.preventDefault());
    addEventListener('dragstart', e => e.preventDefault());

    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(animate);
</script>
</body>
</html>
